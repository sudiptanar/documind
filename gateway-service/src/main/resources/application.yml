server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # the issuer claim is checked in SecurityConfig, without an OIDC discovery call
          jwk-set-uri: ${AUTH_URL:http://localhost:8081}/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
                allowed-headers: "*"
                exposed-headers: [X-Request-Id]
          routes:
            - id: auth
              uri: ${AUTH_URL:http://localhost:8081}
              predicates: ["Path=/auth/**"]
            - id: ingestion
              uri: ${INGESTION_URL:http://localhost:8082}
              predicates: ["Path=/api/documents,/api/documents/**"]
            - id: query
              uri: ${QUERY_URL:http://localhost:8083}
              # one Path predicate with two patterns; two separate Path entries would be ANDed
              predicates: ["Path=/api/query/**,/api/query,/api/chat/**"]
            - id: notifications
              uri: ${NOTIFICATION_URL:http://localhost:8084}
              predicates: ["Path=/api/notifications/**"]

documind:
  jwt:
    issuer: documind-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-}] "
