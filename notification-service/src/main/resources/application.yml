server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
    username: ${DB_USERNAME:documind}
    password: ${DB_PASSWORD:documind}
  mvc:
    async:
      request-timeout: -1   # SSE streams are long-lived; SseEmitter sets its own timeout
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_URL:http://localhost:8081}/.well-known/jwks.json
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.documind.common.events
    listener:
      observation-enabled: true

documind:
  jwt:
    issuer: documind-auth
  mail:
    from: ${MAIL_FROM:DocuMind <no-reply@documind.local>}
  sse:
    timeout: 30m
    heartbeat: 25s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false   # an SMTP outage should not take the service out of the load balancer
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{requestId:-}] "
